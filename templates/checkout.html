<!DOCTYPE html>
<html>
<head>
    <title>Checkout - ABC Shop</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/checkout.css') }}">
</head>
<body>
    <div class="checkout-container">
        <div class="checkout-header">
            <h1>Checkout</h1>
            <a href="{{ url_for('cart') }}" class="back-link">← Back to Cart</a>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            
        </div>

        <div class="checkout-content">
            <div class="order-summary">
                <h2>Order Summary</h2>
                <div class="summary-items">
                    {% for item in items %}
                    <div class="summary-item">
                        <span class="item-name">{{ item.name }} (x{{ item.quantity }})</span>
                        <span class="item-price">${{ "%.2f"|format(item.price * item.quantity) }}</span>
                    </div>
                    {% endfor %}
                </div>
                <div class="total-line">
                    <span>Total to Pay:</span>
                    <span>${{ "%.2f"|format(total) }}</span>
                </div>
            </div>

            <div class="payment-section">
                <h2>Billing Details</h2>
                <form method="POST" action="{{ url_for('checkout') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" required placeholder="John Doe">
                    </div>
                    <div class="form-group">
                        <label>Shipping Address</label>
                        <textarea required placeholder="123 Street Name, City..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Payment Method</label>
                        <select>
                            <option>Credit Card</option>
                            <option>PayPal</option>
                            <option>Cash on Delivery</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="btn-confirm">Confirm & Place Order</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
